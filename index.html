<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMA Taruna Nusantara</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #08111C;
      color: #C9A45B;
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,164,91,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,164,91,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      pointer-events: none;
    }

    /* Glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      width: 600px; height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(201,164,91,0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    .redirect-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .logo-tn {
      font-family: 'Playfair Display', serif;
      font-size: 80px;
      font-weight: 900;
      font-style: italic;
      color: #C9A45B;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      animation: logoReveal 0.9s cubic-bezier(0.2, 0.8, 0.1, 1) 0.1s forwards;
    }

    @keyframes logoReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .loader-bar {
      width: 200px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      margin: 0 auto 20px;
      overflow: hidden;
      border-radius: 2px;
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #C9A45B, #E0B86A);
      border-radius: 2px;
      animation: loadProgress 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes loadProgress {
      to { width: 100%; }
    }

    .redirect-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.4);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; }
    }

    /* Fade out seluruh halaman sebelum redirect */
    .fade-out {
      animation: pageFadeOut 0.4s ease forwards;
    }

    @keyframes pageFadeOut {
      to {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    body {
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="redirect-wrap" id="wrap">
    <div class="logo-tn">TN</div>
    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
    <div class="redirect-text">MEMUAT PORTAL SISWA...</div>
  </div>

  <script>
    // Tunggu 1.4 detik biar animasi selesai, lalu fade out + redirect
    setTimeout(() => {
      document.getElementById("wrap").classList.add("fade-out");
      document.body.style.opacity = "0";

      setTimeout(() => {
        window.location.href = "frontend/";
      }, 400);
    }, 1400);
  </script>
</body>
</html>
